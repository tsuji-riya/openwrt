name: Build WRC-2533GHBK2-T test images

on:
  push:
    branches:
      - ci/build-wrc-2533ghbk2-t
  workflow_dispatch:

jobs:
  # Source build of this branch (expanded layout), plus an ImageBuilder made
  # from it to try reduced package sets for the 7808 KiB OEM install path.
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip-build]') && !contains(github.event.head_commit.message, '[buildbot-repro]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cat > .config <<'CFG'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_elecom_wrc-2533ghbk2-t=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_IB=y
          CONFIG_IB_STANDALONE=y
          CONFIG_PACKAGE_wpad-mini=m
          CFG
          make defconfig
          grep -E '^CONFIG_(TARGET_(ramips|ROOTFS_INITRAMFS)|IB)' .config

      - name: Download sources
        run: make -j"$(nproc)" download || make -j1 V=s download

      - name: Build
        run: make -j"$(($(nproc) + 1))" BUILD_LOG=1 || make -j1 V=s

      - name: Report image sizes
        run: |
          cd bin/targets/ramips/mt7621
          ls -l
          sha256sum *wrc-2533ghbk2-t* | tee sha256sums-wrc-2533ghbk2-t.txt
          grep -o 'is too big: [0-9]* > [0-9]*' "$GITHUB_WORKSPACE"/logs/target/linux/install.txt 2>/dev/null || true

      - name: Try reduced package sets (ImageBuilder from this branch)
        run: |
          mkdir -p /tmp/ib
          tar -I zstd -xf bin/targets/ramips/mt7621/openwrt-imagebuilder-ramips-mt7621.Linux-x86_64.tar.zst -C /tmp/ib
          bash .github/ci/try-variants.sh /tmp/ib/openwrt-imagebuilder-ramips-mt7621.Linux-x86_64 "$PWD/variants" branch-ib

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrc-2533ghbk2-t-images
          path: |
            bin/targets/ramips/mt7621/*wrc-2533ghbk2-t*
            bin/targets/ramips/mt7621/sha256sums-wrc-2533ghbk2-t.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrc-2533ghbk2-t-variants-branch-ib
          path: |
            variants/*.md
            variants/*/*wrc-2533ghbk2-t*
            variants/*/make.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: logs/

  # Upstream snapshot ImageBuilder (same kernel as the buildbots, current
  # 7808 KiB layout). Shows which package set fits with buildbot kernels.
  snapshot-ib:
    if: ${{ !contains(github.event.head_commit.message, '[buildbot-repro]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: snapshot-ib
            base: https://downloads.openwrt.org/snapshots/targets/ramips/mt7621
            ib: openwrt-imagebuilder-ramips-mt7621.Linux-x86_64
          - label: release-25.12.6-ib
            base: https://downloads.openwrt.org/releases/25.12.6/targets/ramips/mt7621
            ib: openwrt-imagebuilder-25.12.6-ramips-mt7621.Linux-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ci

      - name: Install ImageBuilder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget zstd xsltproc jq

      - name: Download ImageBuilder (${{ matrix.label }})
        run: |
          base="${{ matrix.base }}"
          ib="${{ matrix.ib }}.tar.zst"
          wget -q "$base/$ib"
          wget -q "$base/sha256sums"
          grep " \*\?$ib\$" sha256sums | sha256sum -c -
          wget -q "$base/version.buildinfo" && cat version.buildinfo || true
          mkdir -p /tmp/ib
          tar -I zstd -xf "$ib" -C /tmp/ib

      - name: Report default packages and image sizes (${{ matrix.label }})
        run: |
          base="${{ matrix.base }}"
          wget -q "$base/profiles.json" || exit 0
          {
            echo "## ${{ matrix.label }} profiles.json"
            echo
            echo "- default_packages containing luci: $(jq -r '[.default_packages[] | select(test("luci"))] | join(" ")' profiles.json)"
            echo "- device_packages: $(jq -r '.profiles["elecom_wrc-2533ghbk2-t"].device_packages | join(" ")' profiles.json)"
            echo "- images: $(jq -r '.profiles["elecom_wrc-2533ghbk2-t"].images[] | .name' profiles.json | tr '\n' ' ')"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          wget -q -O - "$base/" | grep -o 'elecom_wrc-2533ghbk2-t[^"<]*' | sort -u || true

      - name: Reproduce Firmware Selector build (${{ matrix.label }})
        run: bash .github/ci/fs-repro.sh "/tmp/ib/${{ matrix.ib }}" "$PWD/variants" "${{ matrix.label }}"

      - name: Try reduced package sets (${{ matrix.label }})
        run: bash .github/ci/try-variants.sh "/tmp/ib/${{ matrix.ib }}" "$PWD/variants" "${{ matrix.label }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrc-2533ghbk2-t-variants-${{ matrix.label }}
          path: |
            variants/*.md
            variants/*/*wrc-2533ghbk2-t*
            variants/*/make.log
          if-no-files-found: warn

  # Build the PR commit with the configuration published by the buildbots
  # (config.buildinfo), limited to this device. Checks that the build does
  # not fail, also when initramfs-factory.bin does not fit 7808 KiB.
  buildbot-repro:
    if: ${{ contains(github.event.head_commit.message, '[buildbot-repro]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PR_REF: ramips-wrc-2533ghbk2-t-expand-firmware
      BB: https://downloads.openwrt.org/snapshots/targets/ramips/mt7621
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift
          sudo docker image prune -a -f || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd jq

      - name: Checkout the PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_REF }}

      - name: Show the commit under test
        run: git log -3 --format='%H %an %s'

      - name: Feeds (pinned to the buildbot feeds.buildinfo)
        run: |
          wget -q "$BB/feeds.buildinfo" -O feeds.buildinfo
          cat feeds.buildinfo
          cp feeds.buildinfo feeds.conf
          ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Configure from the buildbot config.buildinfo
        run: |
          wget -q "$BB/config.buildinfo" -O config.buildinfo
          wget -q "$BB/version.buildinfo" -O - || true
          echo "--- buildbot config.buildinfo ---"; cat config.buildinfo
          grep -v -E '^CONFIG_(ALL_NONSHARED|SDK|IB|MAKE_TOOLCHAIN|TARGET_ALL_PROFILES|SDK_LLVM_BPF)[=_]' \
            config.buildinfo > .config
          cat >> .config <<'CFG'
          # CONFIG_ALL_NONSHARED is not set
          # CONFIG_SDK is not set
          # CONFIG_IB is not set
          # CONFIG_MAKE_TOOLCHAIN is not set
          # CONFIG_TARGET_ALL_PROFILES is not set
          CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_elecom_wrc-2533ghbk2-t=y
          CFG
          make defconfig
          echo "--- effective settings ---"
          grep -E '^CONFIG_(TARGET_(MULTI_PROFILE|PER_DEVICE_ROOTFS|ROOTFS_INITRAMFS|DEVICE_ramips)|ALL_KMODS|ALL_NONSHARED|JSON_OVERVIEW_IMAGE_INFO|SDK|IB|KERNEL_)' .config | sort | head -80
          grep -c '^CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_.*=y' .config

      - name: Download sources
        run: make -j"$(nproc)" download || make -j1 V=s download

      - name: Build like the buildbot (IGNORE_ERRORS="n m")
        id: build
        run: |
          set +e
          make -j"$(($(nproc) + 1))" BUILD_LOG=1 IGNORE_ERRORS="n m" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "make exit status: $rc"
          echo "--- packages that failed (ignored like on the buildbot) ---"
          grep -E 'failed to build' build.log | sort -u || true
          exit 0

      - name: Report
        if: always()
        run: |
          d=bin/targets/ramips/mt7621
          {
            echo "## buildbot-config build of the PR commit"
            echo
            echo "- commit: $(git log -1 --format='%h %s')"
            echo "- make exit status: ${{ steps.build.outputs.rc }}"
            echo "- failed packages (ignored): $(grep -E 'failed to build' build.log 2>/dev/null | sed 's/.*ERROR: //' | sort -u | tr '\n' ' ')"
            echo
            echo '```'
            ls -l $d/*wrc-2533ghbk2-t* 2>&1
            echo '```'
            echo
            echo "- warnings:"
            echo '```'
            grep -rh -o 'Image file [^ ]*wrc-2533ghbk2-t[^ ]* is too big: [0-9]* > [0-9]*' logs/ 2>/dev/null | sed 's#.*/##' | sort -u
            echo '```'
            echo "- profiles.json images:"
            echo '```'
            jq -r '.profiles["elecom_wrc-2533ghbk2-t"].images[] | "\(.type) \(.name)"' $d/profiles.json 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum $d/*wrc-2533ghbk2-t* 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrc-2533ghbk2-t-buildbot-repro
          path: |
            bin/targets/ramips/mt7621/*wrc-2533ghbk2-t*
            bin/targets/ramips/mt7621/profiles.json
            config.buildinfo
            feeds.buildinfo
            .config
            build.log
            logs/target/
          if-no-files-found: warn
