name: Build WRC-2533GHBK2-T test images

on:
  push:
    branches:
      - ci/build-wrc-2533ghbk2-t
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cat > .config <<'CFG'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_elecom_wrc-2533ghbk2-t=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CFG
          make defconfig
          grep -E '^CONFIG_TARGET_(ramips|ROOTFS_INITRAMFS)' .config

      - name: Download sources
        run: make -j"$(nproc)" download || make -j1 V=s download

      - name: Build
        run: make -j"$(($(nproc) + 1))" BUILD_LOG=1 || make -j1 V=s

      - name: Check image sizes
        run: |
          cd bin/targets/ramips/mt7621
          ls -l
          sha256sum *wrc-2533ghbk2-t* | tee sha256sums-wrc-2533ghbk2-t.txt
          su=$(stat -c%s *wrc-2533ghbk2-t-squashfs-sysupgrade.bin)
          echo "sysupgrade.bin: $su bytes (limit for upgrade from old layout: 7995392)"
          test -f *wrc-2533ghbk2-t-squashfs-factory.bin
          test "$su" -le 7995392

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrc-2533ghbk2-t-images
          path: |
            bin/targets/ramips/mt7621/*wrc-2533ghbk2-t*
            bin/targets/ramips/mt7621/sha256sums-wrc-2533ghbk2-t.txt
            bin/targets/ramips/mt7621/*.manifest
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: logs/
